name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NPCAP_SDK_URL: https://npcap.com/dist/npcap-sdk-1.13.zip

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: efootball-monitor-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: efootball-monitor-linux-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: efootball-monitor-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Install Npcap SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest $env:NPCAP_SDK_URL -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk
          "LIBPCAP_LIBDIR=$PWD\npcap-sdk\Lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/efootball-monitor.exe, README.md, README.fr.md, LICENSE-MIT, LICENSE-APACHE dist/
          Compress-Archive dist/* ${{ matrix.archive }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/efootball-monitor README.md README.fr.md LICENSE-MIT LICENSE-APACHE dist/
          tar -czf ${{ matrix.archive }} -C dist .
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
